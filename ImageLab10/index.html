<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    

    <a-scene id="mainScene" fog="type: linear; color: #9fb9b8; near: 15; far: 250">
      
      <a-cylinder repeat="5 40" src="../assets/Textures/sand.png" position="-50 -175 -200" radius="5" height="400"></a-cylinder>
      <a-cone repeat="5 5" src="../assets/Textures/sand.png" position="-50 30 -200" radius-bottom="7" height="10"></a-cone>

      <a-sky src ="../assets/Skyboxes/NewSky.png" material="fog: false"></a-sky>

      <script>
        const scene = document.getElementById("mainScene");
        //fog="type: linear; color: #cfe0f5; near: 15; far: 80"
        for (let x = -10; x<10; x++){
          for (let y = -10; y<10; y++){
               const iceCream = document.createElement("a-sphere");
               iceCream.setAttribute("radius", 3)
               iceCream.setAttribute("position", x*30 + " " + "-40" + " " + y*30);
               iceCream.setAttribute("src", "../assets/Textures/icecreamTexture.jpg");
               scene.appendChild(iceCream);

               const cone = document.createElement("a-cone");
               cone.setAttribute("radius-bottom", 2)
               cone.setAttribute("height", 8)
               cone.setAttribute("rotation", "0 0 180")
               cone.setAttribute("position", x*30 + " " + "-46" + " " + y*30);
               cone.setAttribute("src", "../assets/Textures/cone.jpg");
               scene.appendChild(cone);
          }
        }
      </script>
    </a-scene>
  </body>
</html>
