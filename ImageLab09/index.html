<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene id="mainScene">
      <a-sphere position="0 1.25 -20" radius="2" color="#E8E8E8"></a-sphere>
      <a-sphere position="0 3.5 -20" radius="1.5" color="#e8e8e8"></a-sphere>
      <a-sphere position="0 5.2 -20" radius="1.1" color="#e8e8e8"></a-sphere>

      <a-cone color="tomato" position="0 5 -19" radius-bottom=".5" height= "2"  rotation="90 0 0"></a-cone>

      <a-sphere position=".6 5.2 -19" radius=".2" color="black"></a-sphere>
      <a-sphere position="-.6 5.2 -19" radius=".2" color="black"></a-sphere>
    
      <a-cylinder color="black" position="0 5.7 -20" radius="1.5" height=".2"></a-cylinder>
      <a-cylinder color="black" position="0 6 -20" radius="1" height="2"></a-cylinder>
      <a-cylinder color="red" position="0 5.9 -20" radius="1.1" height=".2"></a-cylinder>
      
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <!-- <a-entity environment="preset: japan; dressingAmount: 1"></a-entity> -->

      
      <a-plane color="white" position="0 -.7 0" rotation="-90 0 0" width="300" height="300"></a-plane>
      

      <a-sky color="#b9c4c9"></a-sky>

      <script>
        const scene = document.getElementById("mainScene");

        for (let i = 0; i < 5; i++) {
          const trunk = document.createElement("a-cone");
          trunk.setAttribute("color", "red");
          trunk.setAttribute("position", i+ " 0 0")

          scene.appendChild(trunk)
        }
      </script>
    </a-scene>
  </body>
</html>
